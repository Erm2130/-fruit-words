<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruit Words – เกมคำศัพท์ผลไม้</title>
<style>
:root{--bg:#2b1b4d;--ink:#1e1a2b;--paper:#fffaf0;--pink:#ff5d8f;--sun:#ffc531;--sky:#38b6ff;--ok:#2fbf71}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f3ecff;font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;min-height:100vh}
h1{margin:0;font-size:1.5rem}
header{padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.hs{display:flex;gap:14px;align-items:center;font-size:.95rem;flex-wrap:wrap}
select{font:inherit;padding:3px 6px;border-radius:6px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:0 18px 24px;max-width:1200px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--paper);color:var(--ink);border-radius:18px;padding:18px;text-align:center}
#no{font-size:1.1rem;color:#555}
#no b{font-size:2.6rem;color:var(--pink);margin-left:6px}
#w{font-size:clamp(2.6rem,9vw,5rem);font-weight:800;line-height:1.1;margin:6px 0;min-height:1.1em}
#w.spin{color:#aaa;filter:blur(1.5px)}
#w.land{animation:land .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{from{transform:scale(.4) rotate(-6deg)}to{transform:none}}
#th{font-size:1.5rem;color:#7b3fa0;min-height:1.6em}
#barw{height:8px;background:#e6e2d6;border-radius:4px;margin-top:10px;overflow:hidden}
#bar{height:100%;width:0;background:var(--sun)}
#msg{margin-top:12px;font-size:1.05rem;min-height:2.6em}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:var(--sky);color:#04283f}
button.p{background:var(--pink);color:#fff}
button.g{background:#ddd6c4;color:#333}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:14px}
.chip{background:#e9e2f3;color:#6b6480;border-radius:8px;padding:4px 2px;font-size:.8rem;min-height:44px;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:hidden}
.chip b{font-size:1rem}.chip i{font-style:normal;font-size:.72rem;font-weight:700}
.chip.dealt{background:#ffe9a6;color:#6b5200}
.chip.cur{outline:3px solid var(--pink)}
.chip.ok{background:var(--ok);color:#fff}
details.card{margin-top:14px;text-align:left}
summary{cursor:pointer;font-weight:700}
.hint{margin:8px 0 0;font-size:.9rem;color:#555}
#set{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
button.row{display:flex;align-items:center;gap:8px;background:#f4eee0;color:var(--ink);padding:5px 8px;text-align:left;width:100%;font-weight:700;line-height:1.1;border-radius:10px}
.row .ic{width:32px;height:32px;flex:none}
.row small{display:block;font-weight:400;color:#777}
.row .mk{margin-left:auto;font-size:1.1rem;color:var(--ok)}
.row.off{opacity:.5}.row.off .ic{filter:grayscale(1)}.row.off .mk{color:#999}
.tot{margin:10px 0 0;font-weight:700}
.board{background:var(--paper);border-radius:18px;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;align-content:start}
.tile{aspect-ratio:1;border-radius:14px;background:#fff;border:2px solid #ece3d0;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.tile:hover{background:#fff1bf}
.tile svg{width:78%;height:78%;filter:brightness(0) opacity(.82);transition:filter .3s}
.board.lit .tile svg{filter:none}
.tile .lb{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:.76rem;font-weight:700;color:#333;opacity:0}
.tile.done{cursor:default;background:#e6f9ea;border-color:var(--ok)}
.tile.done svg{filter:none;animation:pop .55s;width:66%;height:66%;margin-bottom:12px}
.tile.done .lb{opacity:1}
.tile.bad{background:#ffb4b4}
@keyframes pop{50%{transform:scale(1.3) rotate(6deg)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header>
 <h1>🍎 Fruit Words</h1>
 <div class="hs">
  <label>โหมด <select id="mode"><option value="deal">แจกคำศัพท์ก่อน</option><option value="direct">สุ่มเลย (ข้ามการแจก)</option></select></label>
  <label>ค้างคำ <select id="hold"><option>3</option><option selected>4</option><option>5</option></select> วินาที</label>
  <label><input type="checkbox" id="showTh" checked> คำแปลไทย</label>
  <label><input type="checkbox" id="shadow" checked> แสดงเงา</label>
  <label><input type="checkbox" id="snd" checked> เสียง</label>
 </div>
</header>
<main>
 <section>
  <div class="card">
   <div id="no"></div>
   <div id="w">?</div>
   <div id="th"></div>
   <div id="barw"><div id="bar"></div></div>
   <div id="msg"></div>
   <div class="btns">
    <button class="p" id="bStart">▶ เริ่มสุ่ม</button>
    <button id="bStop" disabled>⏹ หยุดสุ่ม</button>
    <button class="g" id="bSkip" disabled>ข้ามการค้างคำ ⏭</button>
    <button class="g" id="bReveal" disabled>เฉลย</button>
   </div>
   <div class="btns">
    <button class="g" id="bReset">↺ เริ่มใหม่</button>
   </div>
  </div>
  <div id="grid"></div>
  <details class="card">
   <summary>เลือกผลไม้ที่ใช้ (นักเรียนไม่ครบ 30 คน)</summary>
   <p class="hint">แตะผลไม้เพื่อเอาออกหรือเอากลับมา ผลไม้หนึ่งชนิดต่อนักเรียนหนึ่งคน</p>
   <div id="set"></div>
   <p class="tot">ใช้ <span id="tot"></span> จาก 30 ผล = นักเรียน <span id="tot2"></span> คน <button class="g" id="bAll" style="padding:4px 12px;margin-left:8px">เลือกครบ 30</button></p>
  </details>
 </section>
 <section class="board" id="board"></section>
</main>

const on=Object.fromEntries(F.map(f=>[f.id,true]));
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));

let AC;
function tone(f,d=.12,type='sine',v=.15,t0=0,f2){
 if(!$('#snd').checked)return;
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const seq=(fs,d,type,v,gap)=>fs.forEach((f,i)=>tone(f,d,type,v,i*gap));
const SFX={
 tick:()=>tone(600+Math.random()*600,.05,'square',.04),
 click:()=>tone(520,.07,'triangle',.12),
 land:()=>seq([523,784],.22,'triangle',.2,.1),
 good:()=>seq([523,659,784,1047],.22,'triangle',.2,.09),
 bad:()=>tone(240,.35,'sawtooth',.14,0,100),
 reveal:()=>seq([440,392],.2,'triangle',.15,.12),
 win:()=>seq([523,659,784,659,784,1047,1319],.28,'triangle',.22,.13),
 done:()=>seq([392,523,659],.18,'triangle',.18,.1)};
document.addEventListener('click',e=>{if(e.target.closest('button'))SFX.click()});

let order=[],phase='idle',busy=false,tk=0,done=new Set(),cur=null,skip=null,N=0,spinning=false,holding=false,stopFlag=false,dealIdx=0;
const mode=()=>$('#mode').value;

function renderSet(){
 $('#set').innerHTML=F.map(f=>`<button class="row ${on[f.id]?'':'off'}" data-id="${f.id}" aria-pressed="${on[f.id]}"><span class="ic">${svgOf(f)}</span><span>${f.en}<small>${f.th}</small></span><span class="mk">${on[f.id]?'✓':'＋'}</span></button>`).join('');
 $('#tot').textContent=$('#tot2').textContent=act().length}
$('#set').addEventListener('click',e=>{const b=e.target.closest('.row');if(!b)return;
 const id=b.dataset.id;if(on[id]&&act().length<=1)return;
 on[id]=!on[id];reset()});
$('#bAll').onclick=()=>{F.forEach(f=>on[f.id]=true);reset()};
$('#shadow').onchange=()=>$('#board').classList.toggle('lit',!$('#shadow').checked);
$('#mode').onchange=()=>reset();

function reset(){
 tk++;busy=spinning=holding=stopFlag=false;order=[];done=new Set();cur=null;dealIdx=0;N=act().length;
 $('#w').classList.remove('spin');
 $('#grid').innerHTML=Array.from({length:N},(_,i)=>`<div class="chip" id="c${i}"><b>${i+1}</b><i></i></div>`).join('');
 $('#board').innerHTML=act().map(f=>`<div class="tile" data-id="${f.id}">${svgOf(f)}<span class="lb">${f.en}</span></div>`).join('');
 $('#board').classList.toggle('lit',!$('#shadow').checked);
 $('#w').textContent='?';$('#th').textContent='';$('#bar').style.transition='none';$('#bar').style.width='0';
 if(mode()==='direct'){
  order=sh(act().map(f=>f.id));phase='pick';
  $('#no').innerHTML=`พร้อมสุ่มนักเรียน <b>${N}</b> คน`;
  $('#msg').textContent='กด “เริ่มสุ่ม” แล้วกด “หยุดสุ่ม” เพื่อเลือกนักเรียน จะได้คำศัพท์ทันที'}
 else{
  phase='idle';
  $('#no').innerHTML=`พร้อมแจกให้นักเรียน <b>${N}</b> คน`;
  $('#msg').textContent='กด “เริ่มสุ่ม” แล้วกด “หยุดสุ่ม” เพื่อแจกคำศัพท์ให้นักเรียนเลขที่ 1'}
 renderSet();btns()}
function btns(){
 const pickDone=phase==='pick'&&(cur!==null||done.size>=N);
 $('#bStart').disabled=busy||pickDone;
 $('#bStart').textContent=phase==='pick'?'▶ เริ่มสุ่มนักเรียน':'▶ เริ่มสุ่มคำศัพท์';
 $('#bStop').disabled=!spinning;
 $('#bSkip').disabled=!holding;
 $('#bReveal').disabled=cur===null}
const land=()=>{const e=$('#w');e.classList.remove('land');void e.offsetWidth;e.classList.add('land')};
const show=i=>{const f=Fm[order[i]];$('#w').textContent=f.en;$('#th').textContent=th()?f.th:'';land();SFX.land()};
async function spin(my,fn,min=500){
 const e=$('#w');e.classList.add('spin');spinning=true;stopFlag=false;btns();
 const t=Date.now();
 while((!stopFlag||Date.now()-t<min)&&my===tk){fn();SFX.tick();await sleep(70)}
 e.classList.remove('spin');spinning=false}
function hold(ms){const b=$('#bar');b.style.transition='none';b.style.width='100%';void b.offsetWidth;b.style.transition=`width ${ms}ms linear`;b.style.width='0';holding=true;btns();return new Promise(r=>{skip=r;setTimeout(r,ms)})}

async function start(){
 if(busy)return;
 if(phase==='pick')return pick();
 if(phase==='idle'){order=sh(act().map(f=>f.id));phase='deal'}
 return deal()}
async function deal(){
 const my=tk,i=dealIdx,pool=act();busy=true;btns();
 $('#no').innerHTML=`นักเรียนเลขที่ <b>${i+1}</b>`;$('#msg').textContent='กำลังสุ่มคำศัพท์… กด “หยุดสุ่ม” เมื่อพร้อม';
 await spin(my,()=>{$('#w').textContent=pool[Math.random()*pool.length|0].en;$('#th').textContent=''});
 if(my!==tk)return;
 show(i);$('#msg').textContent='จำคำศัพท์ของตัวเองไว้ให้ดี!';
 await hold(+$('#hold').value*1000);holding=false;
 if(my!==tk)return;
 $('#c'+i).classList.add('dealt');dealIdx++;busy=false;
 if(dealIdx>=N){
  phase='pick';$('#no').innerHTML=`แจกครบ <b>${N}</b> คนแล้ว`;$('#w').textContent='🎉';$('#th').textContent='';
  $('#msg').textContent='กด “เริ่มสุ่มนักเรียน” ได้เลย';SFX.win()}
 else{$('#w').textContent='?';$('#th').textContent='';$('#msg').textContent=`กด “เริ่มสุ่ม” เพื่อแจกคำศัพท์ให้นักเรียนเลขที่ ${dealIdx+1}`;SFX.done()}
 btns()}
async function pick(){
 const left=[...Array(N).keys()].filter(i=>!done.has(i));
 if(!left.length||busy||cur!==null)return;
 const my=tk,pool=act();busy=true;btns();
 $('#w').textContent='?';$('#th').textContent='';$('#msg').textContent='กำลังสุ่มนักเรียน… กด “หยุดสุ่ม” เมื่อพร้อม';
 await spin(my,()=>{$('#no').innerHTML=`นักเรียนเลขที่ <b>${left[Math.random()*left.length|0]+1}</b>`;$('#w').textContent=mode()==='direct'?pool[Math.random()*pool.length|0].en:'?'});
 if(my!==tk)return;
 const win=left[Math.random()*left.length|0];cur=win;busy=false;
 $('#no').innerHTML=`นักเรียนเลขที่ <b>${win+1}</b>`;show(win);
 document.querySelectorAll('.chip').forEach(c=>c.classList.remove('cur'));$('#c'+win).classList.add('cur');
 $('#msg').textContent=mode()==='direct'?'ได้คำศัพท์แล้ว! ออกมาเลือกผลไม้เลย แล้วครูแตะผลไม้ที่นักเรียนเลือก':'ออกมาแปะคำศัพท์บนผลไม้ แล้วครูแตะผลไม้ที่นักเรียนแปะ';
 btns()}
function finish(ok){
 const id=order[cur],t=document.querySelector(`.tile[data-id="${id}"]`);
 t.classList.remove('done');void t.offsetWidth;t.classList.add('done');
 const c=$('#c'+cur);c.classList.remove('cur','dealt');c.classList.add('ok');c.querySelector('i').textContent=Fm[id].en;
 done.add(cur);cur=null;
 $('#msg').textContent=done.size===N?'🏆 ครบทุกคนแล้ว เก่งมาก!':(ok?'✅ ถูกต้อง! เก่งมาก กด “เริ่มสุ่มนักเรียน” คนต่อไป':'เฉลยให้แล้ว ลองจำไว้นะ');
 done.size===N?SFX.win():(ok?SFX.good():SFX.reveal());btns()}
$('#board').addEventListener('click',e=>{
 const t=e.target.closest('.tile');if(!t||cur===null||busy||t.classList.contains('done'))return;
 if(t.dataset.id===order[cur])return finish(true);
 t.classList.add('bad');const b=$('#board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
 SFX.bad();$('#msg').textContent='❌ ยังไม่ใช่ ลองใหม่อีกครั้ง';setTimeout(()=>t.classList.remove('bad'),600)});
$('#bStart').onclick=start;$('#bStop').onclick=()=>{stopFlag=true};$('#bSkip').onclick=()=>skip&&skip();
$('#bReveal').onclick=()=>cur!==null&&finish(false);$('#bReset').onclick=reset;
reset();
</script></body></html>
